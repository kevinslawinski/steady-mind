# =============================================================================
# Caller: CI Pipeline — Angular Application
# =============================================================================
#
# Drop this file into your repo at:  .github/workflows/pipeline.yml
#
# Customize the `with:` inputs to match your project.
# All defaults are shown explicitly so every option is visible at a glance.
# =============================================================================

name: CI Pipeline

on:
  push:
    branches: ['main', 'feature/**']
  pull_request:
    branches: ['main']
    types: [opened, synchronize, reopened]

# Cancel in-progress runs for the same branch to save minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: kevinslawinski/workflows/.github/workflows/ci.yml@v1
    with:
      # ── Node.js ──────────────────────────────────────────────────────────────
      node-version: '24.x'

      # ── Build ─────────────────────────────────────────────────────────────────
      # For GitHub Pages, Angular must be built with the correct --base-href so
      # that routing and assets resolve under the repo subdirectory, e.g.:
      #   ng build --base-href /your-repo-name/
      # Add a script to your package.json ("build-gh": "ng build --base-href /your-repo-name/")
      # and reference it here, or pass the flag inline:
      #   build-command: 'npx ng build --base-href /your-repo-name/'
      # For Cloudflare Pages or any host serving from /, 'npm run build' is sufficient.
      build-command: 'npm run build-gh'
      build-output-path: './dist/steady-mind/browser' # ← change this
      artifact-retention-days: 7

      # ── Lint ──────────────────────────────────────────────────────────────────
      enable-lint: true
      lint-command: 'npm run lint'

      # ── Tests ─────────────────────────────────────────────────────────────────
      enable-tests: true
      test-command: 'npm run test:no-watch'

      # Playwright browser caching for Vitest browser mode.
      # Remove or leave empty if you use a different test runner (e.g. Jest, Karma).
      playwright-package: '@vitest/browser-playwright'
