name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: ['CI Pipeline']
    types: [completed]
    branches: [main]

  # Manual dispatch with artifact reuse
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID to deploy (leave empty for latest successful build)'
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Only deploy successful builds
    if: |
      github.event_name == 'workflow_dispatch' || 
      github.event.workflow_run.conclusion == 'success'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Determine run ID
        id: run-id
        uses: actions/github-script@v7
        with:
          script: |
            if ('${{ github.event_name }}' === 'workflow_dispatch') {
              const runId = '${{ inputs.run_id }}';
              if (runId) {
                core.setOutput('run_id', runId);
                console.log(`Using specified run ID: ${runId}`);
              } else {
                // Find latest successful "CI Pipeline" run on main
                const runs = await github.rest.actions.listWorkflowRuns({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: 'pipeline.yml',
                  branch: 'main',
                  status: 'success',
                  per_page: 1
                });
                if (runs.data.workflow_runs.length === 0) {
                  throw new Error('No successful "CI Pipeline" runs found on main branch');
                }
                const latestRunId = runs.data.workflow_runs[0].id;
                core.setOutput('run_id', latestRunId);
                console.log(`Using latest successful run ID: ${latestRunId}`);
              }
            } else {
              core.setOutput('run_id', '${{ github.event.workflow_run.id }}');
              console.log(`Using triggered run ID: ${{ github.event.workflow_run.id }}`);
            }

      - name: Get commit SHA from workflow run
        id: get-sha
        uses: actions/github-script@v7
        with:
          script: |
            const run = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: ${{ steps.run-id.outputs.run_id }}
            });
            core.setOutput('sha', run.data.head_sha);
            console.log(`Deploying commit: ${run.data.head_sha}`);

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-${{ steps.get-sha.outputs.sha }}
          path: ./dist
          run-id: ${{ steps.run-id.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify build artifacts
        run: |
          if [ ! -d "./dist/steady-mind/browser" ] || [ -z "$(ls -A ./dist/steady-mind/browser)" ]; then
            echo "❌ Error: Build artifacts not found or empty"
            echo "Searched for artifact: build-${{ steps.get-sha.outputs.sha }}"
            echo "From run ID: ${{ steps.run-id.outputs.run_id }}"
            exit 1
          fi
          echo "✅ Build artifacts verified successfully"
          echo "📦 Contents:"
          ls -la ./dist/steady-mind/browser

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/steady-mind/browser

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment summary
        run: |
          echo "## 🚀 Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ steps.get-sha.outputs.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Run ID**: ${{ steps.run-id.outputs.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
